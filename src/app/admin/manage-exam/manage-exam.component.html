<div class="space-y-6">
  <!-- When no subject is selected: Show Subjects Grid (MCards) -->
  <div *ngIf="!selectedSubject" class="animate-fade-in">
    <app-m-cards (subjectSelected)="onSubjectSelected($event)"></app-m-cards>
  </div>

  <!-- When a subject is selected: Show Question Management with Breadcrumb -->
  <div *ngIf="selectedSubject" class="animate-fade-in space-y-6">
    <!-- Breadcrumb & Back button -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-200">
      <div class="flex items-center gap-2 text-sm text-slate-500">
        <button (click)="clearSelectedSubject()" 
                class="hover:text-slate-900 font-medium inline-flex items-center gap-1.5 transition">
          <i class="fas fa-arrow-left text-xs"></i>
          <span>All Subjects</span>
        </button>
        <span class="text-slate-300">/</span>
        <span class="font-semibold text-slate-900">{{ selectedSubject.subjectName }}</span>
        <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-mono">
          {{ selectedSubject.subjectCode }}
        </span>
      </div>

      <button (click)="clearSelectedSubject()" 
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">
        <i class="fas fa-xmark text-xs"></i>
        <span>Close Manager</span>
      </button>
    </div>

    <!-- Question Management Component -->
    <app-manage-que [subject]="selectedSubject"></app-manage-que>
  </div>
</div>
