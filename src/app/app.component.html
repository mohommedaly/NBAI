<!-- Global Minimalist Loading Indicator -->
<div *ngIf="loadingService.loading$ | async" 
     class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex flex-col justify-center items-center gap-3 transition-opacity">
  <div class="w-10 h-10 border-2 border-slate-300 border-t-slate-900 rounded-full animate-spin"></div>
  <span class="text-xs font-medium text-slate-700 tracking-wider uppercase">Loading...</span>
</div>
